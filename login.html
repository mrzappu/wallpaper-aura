<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In | Wallpaper Aura</title>
    <link rel="stylesheet" href="style.css">
    <!-- Distinct Font for Login: Plus Jakarta Sans -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=Space+Grotesk:wght@600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>
</head>
<body class="page-login">
    <!-- Ambient Aurora Glows -->
    <div class="aura-glow-top"></div>
    <div class="aura-glow-bottom"></div>

    <!-- Minimal Navbar -->
    <header class="navbar">
        <div class="nav-container">
            <a href="index.html" class="brand-logo">
                <span class="brand-icon"><i class="fa-solid fa-sparkles"></i></span>
                <span class="brand-text">WALLPAPER<span class="accent-text">AURA</span></span>
            </a>

            <div class="nav-actions">
                <a href="index.html" class="btn-secondary" style="font-size:0.85rem; padding:0.45rem 1rem;">
                    <i class="fa-solid fa-arrow-left"></i> Back to Gallery
                </a>
            </div>
        </div>
    </header>

    <!-- Main Standalone Login Card -->
    <main class="login-page-container">
        <div class="login-header">
            <svg class="google-logo-large" viewBox="0 0 24 24" width="44" height="44">
                <path fill="#4285F4" d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z"/>
                <path fill="#34A853" d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z"/>
                <path fill="#FBBC05" d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.06H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.94l2.85-2.22.81-.63z"/>
                <path fill="#EA4335" d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.06l3.66 2.84c.87-2.6 3.3-4.52 6.16-4.52z"/>
            </svg>
            <h2>Sign in with Google</h2>
            <p>Enter your name to link your Google account, save your favorites, and track your download history.</p>
        </div>

        <!-- Official Google GIS Button Render Target -->
        <div id="g_id_signin_box" style="display:flex; justify-content:center; margin-bottom:1.5rem; min-height:44px;"></div>

        <div style="display:flex; align-items:center; gap:0.75rem; margin-bottom:1.5rem; color:var(--text-muted); font-size:0.75rem; text-transform:uppercase; letter-spacing:0.05em;">
            <div style="flex:1; height:1px; background:var(--border-subtle);"></div>
            <span>or sign in directly</span>
            <div style="flex:1; height:1px; background:var(--border-subtle);"></div>
        </div>

        <form id="standaloneLoginForm" novalidate>
            <div class="login-form-group">
                <label for="loginUserName">Enter Your Name</label>
                <input type="text" id="loginUserName" placeholder="Enter your full name" autofocus autocomplete="name">
            </div>

            <div class="login-form-group">
                <label for="loginUserEmail">Google Email</label>
                <input type="email" id="loginUserEmail" placeholder="Enter your Google email (e.g. yourname@gmail.com)" autocomplete="email">
            </div>

            <button type="submit" id="submitLoginBtn" class="btn-login-submit">
                <i class="fa-brands fa-google"></i>
                <span>Sign In to Wallpaper Aura</span>
            </button>

            <button type="button" id="quickOneClickBtn" class="btn-secondary" style="width:100%; margin-top:0.75rem; justify-content:center; padding:0.7rem 1rem; font-size:0.85rem;">
                <i class="fa-solid fa-bolt" style="color:var(--accent-lavender)"></i> Quick Sign In
            </button>
        </form>

        <p style="text-align:center; font-size:0.75rem; color:var(--text-muted); margin-top:1.5rem;">
            By signing in, you agree to Wallpaper Aura's community terms. All wallpapers are 100% free.
        </p>
    </main>

    <!-- Toast Container -->
    <div class="toast-container" id="toastContainer"></div>

    <script src="db.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', async () => {
            await DB.init();

            const form = document.getElementById('standaloneLoginForm');
            const nameInput = document.getElementById('loginUserName');
            const emailInput = document.getElementById('loginUserEmail');

            // Setup GIS button if available (with retry if script loads asynchronously)
            const clientId = DB.getGoogleClientId();
            function initGoogleGIS() {
                if (window.google && window.google.accounts && window.google.accounts.id) {
                    try {
                        google.accounts.id.initialize({
                            client_id: clientId,
                            callback: (res) => {
                                try {
                                    const payload = JSON.parse(atob(res.credential.split('.')[1]));
                                    DB.setCurrentUser({
                                        name: payload.name || 'Google User',
                                        email: payload.email || 'user@gmail.com',
                                        avatar: payload.picture || 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100'
                                    });
                                    window.location.href = 'index.html';
                                } catch(e) { console.error(e); }
                            }
                        });
                        const box = document.getElementById('g_id_signin_box');
                        if (box && !box.hasChildNodes()) {
                            google.accounts.id.renderButton(box, {
                                theme: "filled_blue",
                                size: "large",
                                shape: "pill",
                                text: "signin_with"
                            });
                        }
                        return true;
                    } catch(e) {
                        console.warn('GIS error', e);
                    }
                }
                return false;
            }

            if (!initGoogleGIS()) {
                let attempts = 0;
                const gisTimer = setInterval(() => {
                    attempts++;
                    if (initGoogleGIS() || attempts > 12) {
                        clearInterval(gisTimer);
                    }
                }, 250);
            }

            function completeLogin(name, email) {
                const finalName = name || 'Adithyan';
                let finalEmail = (email || '').trim().toLowerCase();
                if (!finalEmail || !finalEmail.includes('@')) {
                    finalEmail = finalName.toLowerCase().replace(/[^a-z0-9]/g, '') + '@gmail.com';
                }

                const user = {
                    name: finalName,
                    email: finalEmail,
                    avatar: 'https://images.unsplash.com/photo-1534528741775-53994a69daeb?w=100'
                };

                DB.setCurrentUser(user);
                window.location.href = 'index.html';
            }

            // Standalone form login (Impossible to fail, never blocks on validation)
            form.addEventListener('submit', (e) => {
                e.preventDefault();
                completeLogin(nameInput.value.trim(), emailInput.value.trim());
            });

            document.getElementById('quickOneClickBtn')?.addEventListener('click', () => {
                completeLogin(nameInput.value.trim() || 'Adithyan', emailInput.value.trim());
            });
        });
    </script>
</body>
</html>
